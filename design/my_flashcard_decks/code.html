<!doctype html>

<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>My Flashcard Decks</title>
		<!-- Google Fonts: Lexend -->
		<link href="https://fonts.googleapis.com" rel="preconnect" />
		<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
		<link
			href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap"
			rel="stylesheet"
		/>
		<!-- Material Symbols -->
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							primary: '#137fec',
							'primary-dark': '#0f65bd',
							'background-light': '#f6f7f8',
							'background-dark': '#101922',
							'surface-dark': '#1c2936',
							'surface-light': '#ffffff'
						},
						fontFamily: {
							display: ['Lexend', 'sans-serif']
						},
						borderRadius: {
							DEFAULT: '0.25rem',
							lg: '0.5rem',
							xl: '0.75rem',
							'2xl': '1rem',
							full: '9999px'
						}
					}
				}
			};
		</script>
		<style>
			/* iOS-like smooth scrolling and safe areas */
			body {
				-webkit-tap-highlight-color: transparent;
			}
			.pb-safe {
				padding-bottom: env(safe-area-inset-bottom);
			}
			.pt-safe {
				padding-top: env(safe-area-inset-top);
			}
		</style>
		<style>
			body {
				min-height: max(884px, 100dvh);
			}
		</style>
	</head>
	<body
		class="bg-background-light dark:bg-background-dark font-display relative flex min-h-screen flex-col overflow-hidden text-slate-900 antialiased dark:text-white"
	>
		<!-- Top Navigation Bar -->
		<header
			class="bg-background-light/80 dark:bg-background-dark/80 pt-safe sticky top-0 z-50 border-b border-slate-200 backdrop-blur-md transition-colors dark:border-slate-800"
		>
			<div class="flex h-16 items-center justify-between px-5">
				<h1 class="text-xl font-bold tracking-tight">My Decks</h1>
				<div class="flex items-center gap-2">
					<!-- Import Action -->
					<button
						aria-label="Import CSV"
						class="text-primary flex h-10 w-10 items-center justify-center rounded-full transition-colors hover:bg-slate-200 dark:hover:bg-slate-800"
					>
						<span class="material-symbols-outlined text-[24px]">file_upload</span>
					</button>
					<!-- Settings Action -->
					<button
						aria-label="Settings"
						class="flex h-10 w-10 items-center justify-center rounded-full text-slate-600 transition-colors hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-800"
					>
						<span class="material-symbols-outlined text-[24px]">settings</span>
					</button>
				</div>
			</div>
		</header>
		<!-- Main Scrollable Content -->
		<main class="w-full flex-1 overflow-y-auto scroll-smooth px-4 pt-4 pb-24">
			<!-- Welcome / Context Hint (Import CSV) -->
			<div
				class="from-primary/10 border-primary/20 mb-6 flex items-start gap-3 rounded-xl border bg-gradient-to-r to-transparent p-4"
			>
				<div class="bg-primary/20 text-primary shrink-0 rounded-lg p-2">
					<span class="material-symbols-outlined">lightbulb</span>
				</div>
				<div>
					<h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100">Quick Tip</h3>
					<p class="mt-1 text-xs text-slate-600 dark:text-slate-400">
						You can import your existing vocabulary lists via CSV in the settings menu.
					</p>
				</div>
			</div>
			<!-- Deck List -->
			<div class="flex flex-col gap-4">
				<!-- Deck Item 1 -->
				<div
					class="group bg-surface-light dark:bg-surface-dark relative overflow-hidden rounded-2xl border border-slate-200 shadow-sm transition-all hover:shadow-md active:scale-[0.98] dark:border-slate-800"
				>
					<div class="p-5">
						<div class="mb-2 flex items-start justify-between">
							<div>
								<h2 class="text-lg leading-tight font-bold text-slate-900 dark:text-white">
									JLPT N5 Kanji
								</h2>
								<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">120 Cards</p>
							</div>
							<button
								class="-mt-2 -mr-2 rounded-full p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
							>
								<span class="material-symbols-outlined text-[20px]">more_horiz</span>
							</button>
						</div>
						<div class="mt-4 flex items-center gap-3">
							<div class="h-2 flex-1 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
								<div class="bg-primary h-full rounded-full" style="width: 45%"></div>
							</div>
							<span class="text-primary text-sm font-medium whitespace-nowrap">45%</span>
						</div>
					</div>
					<!-- Subtle decorative gradient for depth -->
					<div
						class="pointer-events-none absolute inset-0 bg-gradient-to-br from-white/5 to-transparent"
					></div>
				</div>
				<!-- Deck Item 2 -->
				<div
					class="group bg-surface-light dark:bg-surface-dark relative overflow-hidden rounded-2xl border border-slate-200 shadow-sm transition-all hover:shadow-md active:scale-[0.98] dark:border-slate-800"
				>
					<div class="p-5">
						<div class="mb-2 flex items-start justify-between">
							<div>
								<h2 class="text-lg leading-tight font-bold text-slate-900 dark:text-white">
									Common Verbs
								</h2>
								<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">50 Cards</p>
							</div>
							<button
								class="-mt-2 -mr-2 rounded-full p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
							>
								<span class="material-symbols-outlined text-[20px]">more_horiz</span>
							</button>
						</div>
						<div class="mt-4 flex items-center gap-3">
							<div class="h-2 flex-1 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
								<div class="bg-primary h-full rounded-full" style="width: 10%"></div>
							</div>
							<span class="text-primary text-sm font-medium whitespace-nowrap">10%</span>
						</div>
					</div>
				</div>
				<!-- Deck Item 3 (Completed) -->
				<div
					class="group bg-surface-light dark:bg-surface-dark relative overflow-hidden rounded-2xl border border-slate-200 shadow-sm transition-all hover:shadow-md active:scale-[0.98] dark:border-slate-800"
				>
					<div class="p-5">
						<div class="mb-2 flex items-start justify-between">
							<div>
								<div class="flex items-center gap-2">
									<h2 class="text-lg leading-tight font-bold text-slate-900 dark:text-white">
										Katakana Practice
									</h2>
									<span
										class="material-symbols-outlined text-[18px] text-green-500"
										title="Completed"
										>check_circle</span
									>
								</div>
								<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">46 Cards</p>
							</div>
							<button
								class="-mt-2 -mr-2 rounded-full p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
							>
								<span class="material-symbols-outlined text-[20px]">more_horiz</span>
							</button>
						</div>
						<div class="mt-4 flex items-center gap-3">
							<div class="h-2 flex-1 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
								<div class="h-full rounded-full bg-green-500" style="width: 100%"></div>
							</div>
							<span class="text-sm font-medium whitespace-nowrap text-green-500">100%</span>
						</div>
					</div>
				</div>
				<!-- Deck Item 4 -->
				<div
					class="group bg-surface-light dark:bg-surface-dark relative overflow-hidden rounded-2xl border border-slate-200 shadow-sm transition-all hover:shadow-md active:scale-[0.98] dark:border-slate-800"
				>
					<div class="p-5">
						<div class="mb-2 flex items-start justify-between">
							<div>
								<h2 class="text-lg leading-tight font-bold text-slate-900 dark:text-white">
									Must-know Adjectives
								</h2>
								<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">85 Cards</p>
							</div>
							<button
								class="-mt-2 -mr-2 rounded-full p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
							>
								<span class="material-symbols-outlined text-[20px]">more_horiz</span>
							</button>
						</div>
						<div class="mt-4 flex items-center gap-3">
							<div class="h-2 flex-1 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
								<div class="bg-primary h-full rounded-full" style="width: 25%"></div>
							</div>
							<span class="text-primary text-sm font-medium whitespace-nowrap">25%</span>
						</div>
					</div>
				</div>
			</div>
			<!-- Empty Space at bottom for scrolling past FAB -->
			<div class="h-24"></div>
		</main>
		<!-- Floating Action Button (FAB) -->
		<div class="pb-safe fixed right-6 bottom-6 z-50">
			<button
				aria-label="Create New Deck"
				class="group bg-primary shadow-primary/30 hover:bg-primary-dark focus:ring-primary/30 flex h-14 w-14 items-center justify-center rounded-full text-white shadow-lg transition-all hover:scale-105 focus:ring-4 focus:outline-none active:scale-95"
			>
				<span
					class="material-symbols-outlined text-[32px] transition-transform group-hover:rotate-90"
					>add</span
				>
			</button>
		</div>
	</body>
</html>
