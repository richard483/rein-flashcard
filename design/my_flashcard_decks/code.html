<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Flashcard Decks</title>
<!-- Google Fonts: Lexend -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "primary-dark": "#0f65bd",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1c2936",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* iOS-like smooth scrolling and safe areas */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 pt-safe transition-colors">
<div class="flex items-center justify-between px-5 h-16">
<h1 class="text-xl font-bold tracking-tight">My Decks</h1>
<div class="flex items-center gap-2">
<!-- Import Action -->
<button aria-label="Import CSV" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-primary">
<span class="material-symbols-outlined text-[24px]">file_upload</span>
</button>
<!-- Settings Action -->
<button aria-label="Settings" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-[24px]">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 overflow-y-auto w-full px-4 pb-24 pt-4 scroll-smooth">
<!-- Welcome / Context Hint (Import CSV) -->
<div class="mb-6 p-4 rounded-xl bg-gradient-to-r from-primary/10 to-transparent border border-primary/20 flex items-start gap-3">
<div class="bg-primary/20 p-2 rounded-lg shrink-0 text-primary">
<span class="material-symbols-outlined">lightbulb</span>
</div>
<div>
<h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100">Quick Tip</h3>
<p class="text-xs text-slate-600 dark:text-slate-400 mt-1">You can import your existing vocabulary lists via CSV in the settings menu.</p>
</div>
</div>
<!-- Deck List -->
<div class="flex flex-col gap-4">
<!-- Deck Item 1 -->
<div class="group relative overflow-hidden rounded-2xl bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-800 shadow-sm transition-all hover:shadow-md active:scale-[0.98]">
<div class="p-5">
<div class="flex justify-between items-start mb-2">
<div>
<h2 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">JLPT N5 Kanji</h2>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">120 Cards</p>
</div>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 -mr-2 -mt-2 rounded-full">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
<div class="mt-4 flex items-center gap-3">
<div class="flex-1 h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 45%;"></div>
</div>
<span class="text-sm font-medium text-primary whitespace-nowrap">45%</span>
</div>
</div>
<!-- Subtle decorative gradient for depth -->
<div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
</div>
<!-- Deck Item 2 -->
<div class="group relative overflow-hidden rounded-2xl bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-800 shadow-sm transition-all hover:shadow-md active:scale-[0.98]">
<div class="p-5">
<div class="flex justify-between items-start mb-2">
<div>
<h2 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">Common Verbs</h2>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">50 Cards</p>
</div>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 -mr-2 -mt-2 rounded-full">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
<div class="mt-4 flex items-center gap-3">
<div class="flex-1 h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 10%;"></div>
</div>
<span class="text-sm font-medium text-primary whitespace-nowrap">10%</span>
</div>
</div>
</div>
<!-- Deck Item 3 (Completed) -->
<div class="group relative overflow-hidden rounded-2xl bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-800 shadow-sm transition-all hover:shadow-md active:scale-[0.98]">
<div class="p-5">
<div class="flex justify-between items-start mb-2">
<div>
<div class="flex items-center gap-2">
<h2 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">Katakana Practice</h2>
<span class="material-symbols-outlined text-green-500 text-[18px]" title="Completed">check_circle</span>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">46 Cards</p>
</div>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 -mr-2 -mt-2 rounded-full">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
<div class="mt-4 flex items-center gap-3">
<div class="flex-1 h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-green-500 rounded-full" style="width: 100%;"></div>
</div>
<span class="text-sm font-medium text-green-500 whitespace-nowrap">100%</span>
</div>
</div>
</div>
<!-- Deck Item 4 -->
<div class="group relative overflow-hidden rounded-2xl bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-800 shadow-sm transition-all hover:shadow-md active:scale-[0.98]">
<div class="p-5">
<div class="flex justify-between items-start mb-2">
<div>
<h2 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">Must-know Adjectives</h2>
<p class="text-sm text-slate-500 dark:text-slate-400 mt-1">85 Cards</p>
</div>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 -mr-2 -mt-2 rounded-full">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
<div class="mt-4 flex items-center gap-3">
<div class="flex-1 h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 25%;"></div>
</div>
<span class="text-sm font-medium text-primary whitespace-nowrap">25%</span>
</div>
</div>
</div>
</div>
<!-- Empty Space at bottom for scrolling past FAB -->
<div class="h-24"></div>
</main>
<!-- Floating Action Button (FAB) -->
<div class="fixed bottom-6 right-6 pb-safe z-50">
<button aria-label="Create New Deck" class="group flex items-center justify-center w-14 h-14 bg-primary text-white rounded-full shadow-lg shadow-primary/30 hover:bg-primary-dark transition-all hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-primary/30">
<span class="material-symbols-outlined text-[32px] transition-transform group-hover:rotate-90">add</span>
</button>
</div>
</body></html>
