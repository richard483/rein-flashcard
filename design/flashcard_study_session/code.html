<!doctype html>

<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Flashcard Study Session</title>
		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com" rel="preconnect" />
		<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
		<link
			href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&amp;display=swap"
			rel="stylesheet"
		/>
		<!-- Material Symbols -->
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<!-- Tailwind Config -->
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							primary: '#137fec',
							'background-light': '#f6f7f8',
							'background-dark': '#101922'
						},
						fontFamily: {
							display: ['Lexend', 'sans-serif']
						},
						borderRadius: {
							DEFAULT: '0.25rem',
							lg: '0.5rem',
							xl: '0.75rem',
							'2xl': '1rem',
							'3xl': '1.5rem',
							full: '9999px'
						},
						boxShadow: {
							card: '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
							glow: '0 0 15px rgba(19, 127, 236, 0.3)'
						}
					}
				}
			};
		</script>
		<style>
			body {
				min-height: max(884px, 100dvh);
			}
		</style>
	</head>
	<body
		class="bg-background-light dark:bg-background-dark font-display text-slate-900 transition-colors duration-200 dark:text-white"
	>
		<div
			class="bg-background-light dark:bg-background-dark relative mx-auto flex h-full min-h-screen w-full max-w-md flex-col overflow-x-hidden shadow-2xl"
		>
			<!-- Header -->
			<header class="flex items-center justify-between p-4 pt-6 pb-2">
				<div class="flex w-12 justify-start">
					<button
						class="flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition-colors hover:bg-black/5 dark:text-slate-400 dark:hover:bg-white/10"
					>
						<span class="material-symbols-outlined">close</span>
					</button>
				</div>
				<h2 class="flex-1 text-center text-lg leading-tight font-bold tracking-tight">
					JLPT N5 Core
				</h2>
				<div class="flex w-12 justify-end">
					<button
						class="flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition-colors hover:bg-black/5 dark:text-slate-400 dark:hover:bg-white/10"
					>
						<span class="material-symbols-outlined">more_horiz</span>
					</button>
				</div>
			</header>
			<!-- Progress Bar Section -->
			<div class="flex flex-col gap-2 px-6 py-2">
				<div class="flex items-end justify-between">
					<span
						class="text-xs font-medium tracking-wider text-slate-500 uppercase dark:text-slate-400"
						>Session Progress</span
					>
					<span class="text-primary text-sm font-bold dark:text-blue-400">12/50</span>
				</div>
				<div class="h-3 w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800">
					<div class="bg-primary h-full rounded-full" style="width: 25%"></div>
				</div>
			</div>
			<!-- Main Flashcard Area -->
			<main class="relative z-10 flex w-full flex-1 flex-col items-center justify-center p-6">
				<!-- Card Container -->
				<!-- Using a white card look to mimic paper, high contrast against dark bg -->
				<div
					class="perspective-1000 group relative aspect-[4/5] max-h-[500px] w-full cursor-pointer"
				>
					<!-- The Card Itself -->
					<div
						class="shadow-card relative flex h-full w-full flex-col items-center justify-center rounded-3xl border border-slate-100 bg-white p-8 text-center transition-transform duration-500 dark:border-slate-700/50"
					>
						<!-- Top corner tag -->
						<div class="absolute top-6 right-6">
							<span
								class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold tracking-wide text-slate-500 uppercase"
								>Kanji</span
							>
						</div>
						<!-- Main Content -->
						<div class="flex w-full flex-1 flex-col items-center justify-center gap-6">
							<!-- Kanji Character -->
							<h1 class="mt-4 text-8xl font-extrabold tracking-tighter text-slate-900 md:text-9xl">
								猫
							</h1>
							<!-- Divider / Separator -->
							<div class="my-2 h-1 w-12 rounded-full bg-slate-100"></div>
							<!-- Reading & Meaning (Simulating Revealed State or Hints) -->
							<div class="flex flex-col gap-1 opacity-90">
								<p class="text-primary text-2xl font-medium">neko</p>
								<p class="text-lg font-normal text-slate-500">Cat</p>
							</div>
						</div>
						<!-- Bottom hint -->
						<div
							class="absolute bottom-6 flex items-center gap-1 text-sm font-medium text-slate-300"
						>
							<span class="material-symbols-outlined text-base">touch_app</span>
							Tap to flip
						</div>
					</div>
					<!-- Background Stack effect for depth -->
					<div
						class="absolute top-4 left-4 -z-10 h-full w-full rounded-3xl border border-white/5 bg-white/10"
					></div>
					<div
						class="absolute top-8 left-8 -z-20 h-full w-full rounded-3xl border border-white/5 bg-white/5"
					></div>
				</div>
			</main>
			<!-- Actions / Footer -->
			<footer class="px-8 pt-4 pb-10">
				<div class="flex items-center justify-center gap-8 md:gap-12">
					<!-- Don't Know Button -->
					<div class="flex flex-col items-center gap-3">
						<button
							class="group flex h-16 w-16 items-center justify-center rounded-full bg-red-500 shadow-lg ring-4 shadow-red-500/20 ring-transparent transition-all hover:bg-red-600 hover:ring-red-500/20 active:scale-95 md:h-20 md:w-20"
						>
							<span
								class="material-symbols-outlined text-3xl font-bold text-white transition-transform group-hover:-rotate-12 md:text-4xl"
								>close</span
							>
						</button>
						<span class="text-xs font-semibold tracking-wider text-red-400 uppercase">Hard</span>
					</div>
					<!-- Spacer / Middle Action -->
					<div class="mx-2 hidden h-12 w-px rounded-full bg-slate-800/50"></div>
					<!-- Know Button -->
					<div class="flex flex-col items-center gap-3">
						<button
							class="group flex h-16 w-16 items-center justify-center rounded-full bg-green-500 shadow-lg ring-4 shadow-green-500/20 ring-transparent transition-all hover:bg-green-600 hover:ring-green-500/20 active:scale-95 md:h-20 md:w-20"
						>
							<span
								class="material-symbols-outlined text-3xl font-bold text-white transition-transform group-hover:scale-110 md:text-4xl"
								>check</span
							>
						</button>
						<span class="text-xs font-semibold tracking-wider text-green-400 uppercase">Easy</span>
					</div>
				</div>
			</footer>
			<!-- Bottom Spacer for Home Bar -->
			<div class="h-4 w-full"></div>
		</div>
	</body>
</html>
