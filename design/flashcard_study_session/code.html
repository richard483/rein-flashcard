<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flashcard Study Session</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'card': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'glow': '0 0 15px rgba(19, 127, 236, 0.3)',
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="flex items-center justify-between p-4 pt-6 pb-2">
<div class="w-12 flex justify-start">
<button class="flex items-center justify-center w-10 h-10 rounded-full text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight text-center flex-1">JLPT N5 Core</h2>
<div class="w-12 flex justify-end">
<button class="flex items-center justify-center w-10 h-10 rounded-full text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</header>
<!-- Progress Bar Section -->
<div class="flex flex-col gap-2 px-6 py-2">
<div class="flex justify-between items-end">
<span class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Session Progress</span>
<span class="text-sm font-bold text-primary dark:text-blue-400">12/50</span>
</div>
<div class="h-3 w-full rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 25%;"></div>
</div>
</div>
<!-- Main Flashcard Area -->
<main class="flex-1 flex flex-col items-center justify-center p-6 w-full relative z-10">
<!-- Card Container -->
<!-- Using a white card look to mimic paper, high contrast against dark bg -->
<div class="relative w-full aspect-[4/5] max-h-[500px] perspective-1000 group cursor-pointer">
<!-- The Card Itself -->
<div class="relative w-full h-full bg-white rounded-3xl shadow-card border border-slate-100 dark:border-slate-700/50 flex flex-col items-center justify-center p-8 text-center transition-transform duration-500">
<!-- Top corner tag -->
<div class="absolute top-6 right-6">
<span class="px-3 py-1 bg-slate-100 text-slate-500 text-xs font-bold rounded-full uppercase tracking-wide">Kanji</span>
</div>
<!-- Main Content -->
<div class="flex-1 flex flex-col items-center justify-center gap-6 w-full">
<!-- Kanji Character -->
<h1 class="text-8xl md:text-9xl font-extrabold text-slate-900 tracking-tighter mt-4">
                            猫
                        </h1>
<!-- Divider / Separator -->
<div class="w-12 h-1 bg-slate-100 rounded-full my-2"></div>
<!-- Reading & Meaning (Simulating Revealed State or Hints) -->
<div class="flex flex-col gap-1 opacity-90">
<p class="text-2xl font-medium text-primary">neko</p>
<p class="text-lg text-slate-500 font-normal">Cat</p>
</div>
</div>
<!-- Bottom hint -->
<div class="absolute bottom-6 text-slate-300 text-sm font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-base">touch_app</span>
                        Tap to flip
                    </div>
</div>
<!-- Background Stack effect for depth -->
<div class="absolute top-4 left-4 w-full h-full bg-white/10 rounded-3xl -z-10 border border-white/5"></div>
<div class="absolute top-8 left-8 w-full h-full bg-white/5 rounded-3xl -z-20 border border-white/5"></div>
</div>
</main>
<!-- Actions / Footer -->
<footer class="pb-10 pt-4 px-8">
<div class="flex items-center justify-center gap-8 md:gap-12">
<!-- Don't Know Button -->
<div class="flex flex-col items-center gap-3">
<button class="group flex items-center justify-center w-16 h-16 md:w-20 md:h-20 rounded-full bg-red-500 hover:bg-red-600 active:scale-95 transition-all shadow-lg shadow-red-500/20 ring-4 ring-transparent hover:ring-red-500/20">
<span class="material-symbols-outlined text-white text-3xl md:text-4xl font-bold group-hover:-rotate-12 transition-transform">close</span>
</button>
<span class="text-xs font-semibold text-red-400 uppercase tracking-wider">Hard</span>
</div>
<!-- Spacer / Middle Action -->
<div class="w-px h-12 bg-slate-800/50 rounded-full mx-2 hidden"></div>
<!-- Know Button -->
<div class="flex flex-col items-center gap-3">
<button class="group flex items-center justify-center w-16 h-16 md:w-20 md:h-20 rounded-full bg-green-500 hover:bg-green-600 active:scale-95 transition-all shadow-lg shadow-green-500/20 ring-4 ring-transparent hover:ring-green-500/20">
<span class="material-symbols-outlined text-white text-3xl md:text-4xl font-bold group-hover:scale-110 transition-transform">check</span>
</button>
<span class="text-xs font-semibold text-green-400 uppercase tracking-wider">Easy</span>
</div>
</div>
</footer>
<!-- Bottom Spacer for Home Bar -->
<div class="h-4 w-full"></div>
</div>
</body></html>
